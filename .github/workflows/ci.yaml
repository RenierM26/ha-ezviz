# .github/workflows/ci.yaml
name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "tools/check_hassfest.py"
      - "pyproject.toml"
      - ".ruff.toml"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!docs/**"
  push:
    branches: [ main ]         # run after merge
    tags: [ "v*" ]             # run on releases
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Kill older runs for the same ref (stops “double running” on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exercise the published minimum declared by the integration manifest.
  PYEZVIZAPI_VERSION: 2.0.0

jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install tooling + deps
        run: |
          pip install ruff mypy pytest types-requests
          pip install "pyezvizapi==${PYEZVIZAPI_VERSION}"
          python -m pip check

      - name: Ruff
        run: ruff check custom_components tests tools

      - name: Core-style component formatting
        run: ruff format --check custom_components/ezviz_cloud

      - name: mypy
        run: mypy --install-types --non-interactive custom_components tests tools

      - name: pytest (only if tests exist)
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            # Nested tests/components requires a Home Assistant core checkout.
            # This standalone job installs only the SDK and test tooling.
            pytest -q tests/test_*.py
          else
            echo "No tests found under tests/, skipping pytest."
          fi

  real-ha:
    name: Real HA inventory and push contract (2026.10.4)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install isolated real-HA runtime and published SDK
        run: |
          python -m pip install -r tests/acceptance/requirements.txt "pyezvizapi==${PYEZVIZAPI_VERSION}"
          python -m pip check
      - name: Actual HA storage, inventory, config, commands and lifecycle controls
        run: python -m pytest -p pytest_homeassistant_custom_component --asyncio-mode=auto tests/acceptance

  native-ha:
    name: Native HA hardening (${{ matrix.ha-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["2026.10.4", "2026.11.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install native HA without the version-pinned HA pytest plugin
        run: |
          python -m pip install -r tests/runtime/requirements.txt "homeassistant==${{ matrix.ha-version }}" "pyezvizapi==${PYEZVIZAPI_VERSION}"
          python -m pip check
      - name: Confirm actual runtime versions and absence of HA test-plugin patches
        run: |
          python - <<'PYVERSIONS'
          from importlib.metadata import version
          from importlib.util import find_spec
          print("HA", version("homeassistant"), "SDK", version("pyezvizapi"))
          assert find_spec("pytest_homeassistant_custom_component") is None
          PYVERSIONS
      - name: Real shutdown, worker ownership, image CPU and durable storage
        run: |
          python -m coverage run --branch --source=custom_components.ezviz_cloud.config_flow,custom_components.ezviz_cloud.diagnostics -m pytest --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=function tests/runtime
          python -m coverage report --show-missing --fail-under=100
