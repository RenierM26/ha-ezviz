# .github/workflows/ci.yaml
name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ruff.toml"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!docs/**"
  push:
    branches: [ main ]         # run after merge
    tags: [ "v*" ]             # run on releases
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Kill older runs for the same ref (stops “double running” on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYEZVIZAPI_VERSION: 1.0.5.0

jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install tooling + deps
        run: |
          pip install ruff mypy pytest types-requests
          pip install "pyezvizapi==${PYEZVIZAPI_VERSION}"
          python -m pip check

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy --install-types --non-interactive .

      - name: pytest (only if tests exist)
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            # Nested tests/components requires a Home Assistant core checkout.
            # This standalone job installs only the SDK and test tooling.
            pytest -q tests/test_*.py
          else
            echo "No tests found under tests/, skipping pytest."
          fi

  snapshot-ha:
    name: Snapshot service and image lifecycle (HA 2026.10.4)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install real HA and the declared SDK minimum
        run: |
          python -m pip install -r tests/acceptance/requirements.txt "pyezvizapi==${PYEZVIZAPI_VERSION}"
          python -m pip check
      - name: Snapshot response, dispatcher and image cache controls
        run: python -m pytest -p pytest_homeassistant_custom_component --asyncio-mode=auto tests/acceptance
