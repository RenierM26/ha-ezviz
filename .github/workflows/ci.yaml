# .github/workflows/ci.yaml
name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ruff.toml"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!docs/**"
  push:
    branches: [ main ]         # run after merge
    tags: [ "v*" ]             # run on releases
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Kill older runs for the same ref (stops “double running” on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Replaced with the owner-published release at integration release handoff.
  PYEZVIZAPI_REF: 1a0e19771cc49dc5d0afefab12ee74044d26ea3c

jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check out the required SDK candidate
        uses: actions/checkout@v7
        with:
          repository: RenierM26/pyEzvizApi
          ref: ${{ env.PYEZVIZAPI_REF }}
          path: .sdk

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install tooling + deps
        run: |
          pip install ruff mypy pytest types-requests
          pip install -e .sdk  # require the new SDK; no released-version fallback

      - name: Ruff
        run: ruff check custom_components tests

      - name: mypy
        run: mypy --install-types --non-interactive custom_components tests

      - name: pytest (only if tests exist)
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            # Nested tests/components requires a Home Assistant core checkout.
            # This standalone job installs only the SDK and test tooling.
            pytest -q tests/test_*.py
          else
            echo "No tests found under tests/, skipping pytest."
          fi

  real-ha:
    name: Real HA inventory and push contract (2026.10.4)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check out reviewed inventory SDK candidate
        uses: actions/checkout@v7
        with:
          repository: RenierM26/pyEzvizApi
          # Source qualification, not a fictional PyPI release/manifest bump.
          ref: ${{ env.PYEZVIZAPI_REF }}
          path: .sdk
      - name: Install isolated real-HA runtime and candidate SDK
        run: python -m pip install -r tests/acceptance/requirements.txt -e .sdk
      - name: Actual HA storage, inventory, config, commands and lifecycle controls
        run: python -m pytest -p pytest_homeassistant_custom_component --asyncio-mode=auto tests/acceptance
