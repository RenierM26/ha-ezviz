name: Validate with hassfest

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "manifest.json"
      - ".github/workflows/hassfest.yaml"
      - "tools/check_hassfest.py"
      - "!**/*.md"
      - "!docs/**"
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run hassfest (one documented custom-only SDK exception)
        run: |
          docker run --rm \
            --workdir /usr/src/homeassistant \
            --volume "${GITHUB_WORKSPACE}:/github/workspace:ro" \
            --entrypoint python3 \
            ghcr.io/home-assistant/hassfest \
            /github/workspace/tools/check_hassfest.py \
            --action validate \
            --integration-path /github/workspace/custom_components/ezviz_cloud
