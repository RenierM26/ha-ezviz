name: Validate with hassfest

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: hassfest-${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Run hassfest (one documented custom-only SDK exception)
        run: |
          docker run --rm \
            --workdir /usr/src/homeassistant \
            --volume "${GITHUB_WORKSPACE}:/github/workspace:ro" \
            --entrypoint python3 \
            ghcr.io/home-assistant/hassfest:latest@sha256:da6522993280166fe072704989a2b4c33e639e8ceb69c8ab6ad7ec5045c1a1e3 \
            /github/workspace/tools/check_hassfest.py \
            --action validate \
            --integration-path /github/workspace/custom_components/ezviz_cloud
