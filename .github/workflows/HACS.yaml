name: HACS Action

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: HACS validation
        uses: ./.github/actions/hacs
        with:
          category: integration
          # Optional: restrict to your integration path (faster)
          ignore: brands