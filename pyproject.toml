[tool.ruff]
extend = "tools/core_ruff.toml"

# mypy: point at the integration; keep imports lenient (no HA install needed)
[tool.mypy]
# Real-HA tests use their separately pinned runtime and published SDK minimum.
exclude = ["^tests/acceptance/", "^tests/runtime/"]
python_version = "3.14"
files = ["custom_components"]
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
no_implicit_optional = true
check_untyped_defs = true

# Put pytest settings here so it won’t try to collect inside custom_components
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
