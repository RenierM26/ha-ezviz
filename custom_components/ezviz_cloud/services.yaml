wake_device:
  target:
    entity:
      integration: ezviz_cloud
      domain: camera
capture_picture:
  target:
    entity:
      integration: ezviz_cloud
      domain: camera

ptz_control_coordinates:
  target:
    entity:
      integration: ezviz_cloud
      domain: camera
  fields:
    x_axis:
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: box
    y_axis:
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: box
    lens:
      default: auto
      selector:
        select:
          mode: dropdown
          options:
            - auto
            - "1"
            - "2"
          translation_key: ptz_lens
